<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #764ba2;
        }
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .user-data {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
            display: none;
        }
        .loading {
            text-align: center;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Login System</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            
            <button type="submit">Login</button>
        </form>

        <div class="message" id="message"></div>
        
        <div class="user-data" id="userData">
            <h3>User Data:</h3>
            <pre id="dataContent" style="background: white; padding: 10px; border-radius: 3px; overflow-x: auto;"></pre>
        </div>

        <div style="margin-top: 20px; padding: 15px; background: #fff3cd; border-radius: 5px; border: 1px solid #ffc107;">
            <p style="font-size: 12px; color: #856404;">
                ⚠️ <strong>Note:</strong> This application contains deliberate security vulnerabilities for educational purposes!<br>
                Do not use this approach in real applications.
            </p>
        </div>
    </div>

    <script>
        // API URL for the backend service.
        const API_URL = 'https://management-secrets-and-rotation.onrender.com';

        const loginForm = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');
        const userDataDiv = document.getElementById('userData');
        const dataContent = document.getElementById('dataContent');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            messageDiv.textContent = 'Checking credentials...';
            messageDiv.className = 'message loading';
            messageDiv.style.display = 'block';
            userDataDiv.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Login failed');
                }

                // Store the access token in sessionStorage for later use
                sessionStorage.setItem('access_token', data.token);

                const profileResponse = await fetch(`${API_URL}/api/me`, {
                    headers: {
                        'Authorization': `Bearer ${data.token}`
                    }
                });

                const profile = await profileResponse.json();
                if (!profileResponse.ok) {
                    throw new Error(profile.message || 'Could not load profile');
                }

                messageDiv.textContent = '✅ Login successful!';
                messageDiv.className = 'message success';
                userDataDiv.style.display = 'block';
                dataContent.textContent = JSON.stringify(profile, null, 2);
                loginForm.reset();
            } catch (error) {
                sessionStorage.removeItem('access_token');
                messageDiv.textContent = '❌ ' + error.message;
                messageDiv.className = 'message error';
            }
        });
    </script>
</body>
</html>
